<p *ngIf="!loanDetailsList">Loading...</p>

<table mat-table [dataSource]="loanDetailsList" class="mat-elevation-z8">
  <ng-container matColumnDef="amountRequested">
    <th mat-header-cell *matHeaderCellDef>Amount Requested</th>
    <td mat-cell *matCellDef="let loan">{{ loan.amountRequested }}</td>
  </ng-container>

  <ng-container matColumnDef="amountPaid">
    <th mat-header-cell *matHeaderCellDef>Amount Paid</th>
    <td mat-cell *matCellDef="let loan">{{ loan.amountPaid }}</td>
  </ng-container>

  <ng-container matColumnDef="balance">
    <th mat-header-cell *matHeaderCellDef>Balance</th>
    <td mat-cell *matCellDef="let loan">{{ loan.balance }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let loan">{{ loan.status }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let loan">
      <button mat-flat-button (click)="onPay(loan)">Basic</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="tableColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: tableColumns"></tr>
</table>
<a mat-flat-button routerLink="/loans/create">Create Loan</a>
