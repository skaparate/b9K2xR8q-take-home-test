<h2>Create Loan</h2>
<p *ngIf="isLoading">Loading...</p>
<ng-container *ngIf="!isLoading">
  <div>
    <mat-form-field>
      <mat-label>Amount Requested</mat-label>
      <input matInput type="number" min="0" step="1000" [(ngModel)]="loanCreation.amountRequested">
    </mat-form-field>
  </div>
  <div>
    <mat-form-field>
      <mat-label>Account Holder</mat-label>
      <mat-select [(value)]="loanCreation.accountHolderId">
        @for (ac of accountHolders; track ac) {
          <mat-option [value]="ac.id">{{ ac.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
  <div>
    <button mat-flat-button (click)="onSubmit()">Submit Loan</button>
    <a mat-button [routerLink]="['/loans']">Cancel</a>
  </div>
  <p *ngIf="errorMsg">{{ errorMsg }}</p>
</ng-container>
